<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 640"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Two ways to add a song to your queue</title>
  <desc id="description">
    Track A is playing, with tracks B and D already queued. Adding track C with Play next puts it
    before B. Add to end puts C after D. Neither action interrupts track A.
  </desc>
  <rect width="1000" height="640" rx="24" fill="#111113" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="58" fill="#f3f3f3" font-size="30" font-weight="700">Where your song goes</text>
    <text x="40" y="94" fill="#aaa" font-size="19">
      Track A is playing. B and D are queued. You choose Track C.
    </text>

    <rect x="40" y="126" width="444" height="424" rx="18" fill="#1c1c1f" stroke="#333337" />
    <text x="64" y="172" fill="#f3f3f3" font-size="26" font-weight="700">Play next</text>
    <text x="64" y="202" fill="#aaa" font-size="18">Hear your pick after the current song.</text>

    <rect x="64" y="228" width="396" height="64" rx="10" fill="#27272b" />
    <text x="84" y="267" fill="#f3f3f3" font-size="23">Track A</text>
    <text x="440" y="266" text-anchor="end" fill="#aaa" font-size="17">Playing</text>
    <rect x="64" y="304" width="396" height="64" rx="10" fill="#ffdb4d" />
    <text x="84" y="343" fill="#171719" font-size="23" font-weight="700">Track C</text>
    <text x="440" y="342" text-anchor="end" fill="#171719" font-size="17">Your pick</text>
    <rect x="64" y="380" width="396" height="64" rx="10" fill="#27272b" />
    <text x="84" y="419" fill="#d0d0d3" font-size="23">Track B</text>
    <rect x="64" y="456" width="396" height="64" rx="10" fill="#27272b" />
    <text x="84" y="495" fill="#d0d0d3" font-size="23">Track D</text>

    <rect x="516" y="126" width="444" height="424" rx="18" fill="#1c1c1f" stroke="#333337" />
    <text x="540" y="172" fill="#f3f3f3" font-size="26" font-weight="700">Add to end</text>
    <text x="540" y="202" fill="#aaa" font-size="18">Keep the songs you've already lined up.</text>

    <rect x="540" y="228" width="396" height="64" rx="10" fill="#27272b" />
    <text x="560" y="267" fill="#f3f3f3" font-size="23">Track A</text>
    <text x="916" y="266" text-anchor="end" fill="#aaa" font-size="17">Playing</text>
    <rect x="540" y="304" width="396" height="64" rx="10" fill="#27272b" />
    <text x="560" y="343" fill="#d0d0d3" font-size="23">Track B</text>
    <rect x="540" y="380" width="396" height="64" rx="10" fill="#27272b" />
    <text x="560" y="419" fill="#d0d0d3" font-size="23">Track D</text>
    <rect x="540" y="456" width="396" height="64" rx="10" fill="#ffdb4d" />
    <text x="560" y="495" fill="#171719" font-size="23" font-weight="700">Track C</text>
    <text x="916" y="494" text-anchor="end" fill="#171719" font-size="17">Your pick</text>

    <text x="40" y="590" fill="#f3f3f3" font-size="20">Your current song keeps playing.</text>
    <text x="960" y="620" text-anchor="end" fill="#999" font-size="16">
      Queue order illustration · sample tracks
    </text>
  </g>
</svg>
